<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" width="1600" height="420">
  <defs>
    <pattern id="blueprint-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1D3557" stroke-width="0.6" opacity="0.22" />
    </pattern>
    <pattern id="ink-halftone" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="2" fill="#E63946" opacity="0.35" />
    </pattern>
    <pattern id="ochre-dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="1.8" fill="#1D3557" opacity="0.3" />
    </pattern>
  </defs>

  <!-- Base Archival Cotton Canvas -->
  <rect width="1600" height="420" fill="#F8F4EA" />
  <rect x="10" y="10" width="1580" height="400" fill="none" stroke="#0A0A0A" stroke-width="4" />

  <!-- Four Equal Columns Separated by 4px Structural Rules -->
  <line x1="400" y1="10" x2="400" y2="410" stroke="#0A0A0A" stroke-width="4" />
  <line x1="800" y1="10" x2="800" y2="410" stroke="#0A0A0A" stroke-width="4" />
  <line x1="1200" y1="10" x2="1200" y2="410" stroke="#0A0A0A" stroke-width="4" />

  <!-- PANEL 01: INQUIRY & GRAPHITE WIREFRAME SKETCHES -->
  <g transform="translate(12, 12)">
    <rect x="0" y="0" width="386" height="396" fill="#F5F0E3" />
    <rect x="24" y="24" width="338" height="348" fill="url(#blueprint-grid)" stroke="#1D3557" stroke-width="1.2" />
    <!-- 3 Thumbnail Concept Boxes -->
    <rect x="44" y="48" width="90" height="114" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="1.5" />
    <circle cx="89" cy="96" r="24" fill="none" stroke="#1D3557" stroke-width="1.5" stroke-dasharray="4 3" />
    <line x1="44" y1="138" x2="134" y2="76" stroke="#E63946" stroke-width="1.2" />

    <rect x="150" y="48" width="90" height="114" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="1.5" />
    <polygon points="164,148 195,70 226,148" fill="none" stroke="#1D3557" stroke-width="1.6" />
    <rect x="176" y="102" width="38" height="38" fill="none" stroke="#E63946" stroke-width="1.2" />

    <rect x="256" y="48" width="90" height="114" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2" />
    <circle cx="301" cy="105" r="28" fill="none" stroke="#0A0A0A" stroke-width="2" />
    <path d="M 273 105 L 329 105 M 301 77 L 301 133" stroke="#E63946" stroke-width="1.5" />

    <!-- Hero Drafting Frame Below -->
    <rect x="44" y="186" width="302" height="164" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="1.5" />
    <line x1="44" y1="186" x2="346" y2="350" stroke="#94A3B8" stroke-width="1" stroke-dasharray="5 4" />
    <line x1="346" y1="186" x2="44" y2="350" stroke="#94A3B8" stroke-width="1" stroke-dasharray="5 4" />
    <circle cx="195" cy="268" r="52" fill="none" stroke="#1D3557" stroke-width="2" />
    <!-- Wax seal / pencil accent -->
    <line x1="88" y1="330" x2="296" y2="206" stroke="#1E293B" stroke-width="6" stroke-linecap="round" />
    <polygon points="296,206 312,196 302,212" fill="#F4A261" />
  </g>

  <!-- PANEL 02: REVIEW & ARCHITECTURAL GRID BLOCKING -->
  <g transform="translate(402, 12)">
    <rect x="0" y="0" width="396" height="396" fill="#EFE9DA" />
    <!-- Modular Swiss Grid Lines -->
    <rect x="32" y="32" width="332" height="332" fill="#FAF6EE" stroke="#0A0A0A" stroke-width="2.5" />
    <line x1="198" y1="32" x2="198" y2="364" stroke="#0A0A0A" stroke-width="2.5" />
    <line x1="32" y1="198" x2="364" y2="198" stroke="#0A0A0A" stroke-width="2.5" />
    <rect x="32" y="32" width="166" height="166" fill="#1D3557" />
    <rect x="198" y="198" width="166" height="166" fill="#F4A261" />
    <rect x="198" y="32" width="166" height="84" fill="url(#ochre-dots)" />
    <!-- Brass Compass Geometric Arcs -->
    <circle cx="198" cy="198" r="112" fill="none" stroke="#E63946" stroke-width="2.5" />
    <circle cx="198" cy="198" r="68" fill="none" stroke="#0A0A0A" stroke-width="1.5" stroke-dasharray="6 4" />
    <!-- Brass Divider Silhouette -->
    <polygon points="114,296 198,116 205,120 124,300" fill="#B48A3E" stroke="#0A0A0A" stroke-width="1.2" />
    <polygon points="282,296 198,116 191,120 272,300" fill="#D4AF37" stroke="#0A0A0A" stroke-width="1.2" />
    <circle cx="198" cy="116" r="10" fill="#D4AF37" stroke="#0A0A0A" stroke-width="1.5" />
  </g>

  <!-- PANEL 03: DEVELOPMENT · CMYK & PIN PROOFING PLATES -->
  <g transform="translate(802, 12)">
    <rect x="0" y="0" width="396" height="396" fill="#182236" />
    <!-- Offset Overlapping Silkscreen Separation Plates -->
    <rect x="44" y="48" width="230" height="260" fill="#E63946" opacity="0.9" stroke="#0A0A0A" stroke-width="2" />
    <rect x="82" y="76" width="230" height="260" fill="#1D3557" opacity="0.88" stroke="#FAF6EE" stroke-width="2" />
    <rect x="122" y="102" width="230" height="248" fill="#F4A261" opacity="0.92" stroke="#0A0A0A" stroke-width="2" />
    <!-- Artwork Inside Front Layer -->
    <circle cx="237" cy="216" r="72" fill="#FAF6EE" stroke="#0A0A0A" stroke-width="2.5" />
    <path d="M 165 216 A 72 72 0 0 1 309 216 Z" fill="#E63946" />
    <rect x="165" y="216" width="144" height="8" fill="#0A0A0A" />
    <!-- Interactive Coordinate Proofing Pins -->
    <g>
      <circle cx="176" cy="158" r="13" fill="#0A0A0A" stroke="#FFFFFF" stroke-width="2" />
      <circle cx="176" cy="158" r="4" fill="#F4A261" />
      <circle cx="292" cy="242" r="13" fill="#E63946" stroke="#FFFFFF" stroke-width="2" />
      <circle cx="292" cy="242" r="4" fill="#FFFFFF" />
      <circle cx="212" cy="284" r="13" fill="#10B981" stroke="#FFFFFF" stroke-width="2" />
      <circle cx="212" cy="284" r="4" fill="#FFFFFF" />
    </g>
  </g>

  <!-- PANEL 04: DELIVERY · COLLECTOR PRESS MASTER -->
  <g transform="translate(1202, 12)">
    <rect x="0" y="0" width="386" height="396" fill="#F8F4EA" />
    <!-- Mounted Collector Proof Frame -->
    <rect x="38" y="34" width="310" height="304" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="3" />
    <rect x="56" y="52" width="274" height="268" fill="#FAF6EE" stroke="#0A0A0A" stroke-width="1.5" />
    <rect x="56" y="52" width="144" height="162" fill="#E63946" />
    <rect x="200" y="52" width="130" height="94" fill="#1D3557" />
    <rect x="200" y="146" width="130" height="68" fill="url(#ink-halftone)" />
    <rect x="56" y="214" width="144" height="106" fill="#F4A261" />
    <rect x="200" y="214" width="130" height="106" fill="#0A0A0A" />
    <circle cx="265" cy="267" r="34" fill="#FAF6EE" />
    <circle cx="265" cy="267" r="16" fill="#E63946" />
    <line x1="200" y1="52" x2="200" y2="320" stroke="#0A0A0A" stroke-width="4" />
    <line x1="56" y1="214" x2="330" y2="214" stroke="#0A0A0A" stroke-width="4" />

    <!-- Wax Approval Stamp & Registration Bars Below -->
    <circle cx="312" cy="346" r="24" fill="#E63946" stroke="#0A0A0A" stroke-width="2" />
    <circle cx="312" cy="346" r="15" fill="none" stroke="#F4A261" stroke-width="2" />
    <g transform="translate(40, 352)">
      <rect x="0" y="0" width="28" height="12" fill="#E63946" />
      <rect x="32" y="0" width="28" height="12" fill="#1D3557" />
      <rect x="64" y="0" width="28" height="12" fill="#F4A261" />
      <rect x="96" y="0" width="28" height="12" fill="#0A0A0A" />
      <rect x="128" y="0" width="28" height="12" fill="#10B981" />
    </g>
  </g>
</svg>
