  <text x="68" y="1068" font-family="Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="800" letter-spacing="4" fill="#F4A261">CARTOGRAPHY OF SYNTHETIC MINDS</text>
  <text x="68" y="1104" font-family="Courier New, monospace" font-size="16" fill="#CBD5E1">ISOMETRIC EDITORIAL SPREAD · SCALE 1:25 · PLATE CODE ECD-MIT-08</text>
  <rect x="68" y="1124" width="180" height="10" fill="#E63946" />
  <rect x="256" y="1124" width="180" height="10" fill="#F4A261" />
  <rect x="444" y="1124" width="180" height="10" fill="#1D3557" />
