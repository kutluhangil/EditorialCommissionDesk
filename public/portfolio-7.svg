  <text x="48" y="1095" font-family="Courier New, monospace" font-size="18" font-weight="700" fill="#555555">PMS 485C VERMILION · PMS 534C COBALT · PMS 1375C OCHRE · DEEP BLACK</text>
  <rect x="48" y="1125" width="800" height="4" fill="#111111" />
  <text x="48" y="1156" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="4" fill="#E63946">ATELIER MONDRIAN · COMMISSION ARCHIVE 07</text>
