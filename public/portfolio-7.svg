  <text x="54" y="110" font-family="Helvetica Neue, Arial, sans-serif" font-size="30" font-weight="800" letter-spacing="8" fill="#FFFFFF">STAATSOPER WIEN</text>
  <text x="54" y="235" font-family="Helvetica Neue, Arial, sans-serif" font-size="112" font-weight="900" letter-spacing="-4" fill="#111111">OPERA</text>
  <text x="54" y="348" font-family="Helvetica Neue, Arial, sans-serif" font-size="96" font-weight="900" letter-spacing="-3" fill="#FFFFFF">2026/27</text>

  <text x="622" y="102" font-family="Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="4" fill="#F4A261">WINTER</text>
  <text x="622" y="142" font-family="Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="4" fill="#FFFFFF">CYCLE</text>
  <text x="622" y="182" font-family="Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="500" letter-spacing="3" fill="#FFFFFF">DIN A1 SILKSCREEN</text>

